name: Prod Image

on:
  repository_dispatch:
    types: [release-event]
  workflow_dispatch:
    inputs:
      version:
        description: 'Numeric version to publish (e.g. 1.31.4)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-prod-image-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: tugtainer
  AGENT_IMAGE_NAME: tugtainer-agent

jobs:
  build:
    name: Build prod image (${{ matrix.image }}, ${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: app
            dockerfile: Dockerfile.app
            image_name: tugtainer
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - image: app
            dockerfile: Dockerfile.app
            image_name: tugtainer
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: agent
            dockerfile: Dockerfile.agent
            image_name: tugtainer-agent
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - image: agent
            dockerfile: Dockerfile.agent
            image_name: tugtainer-agent
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Get Tags
        id: get-tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.event.client_payload.version }}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid version '$VERSION'. Expected numeric format like 1.31.4"
            exit 1
          fi

          PREFIXED=v$VERSION
          echo "prefixed=$PREFIXED" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }}
            ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }}
          labels: |
            dev.quenary.tugtainer.protected=true
            ${{ matrix.image == 'agent' && 'org.opencontainers.image.title=Tugtainer Agent' || '' }}
            ${{ matrix.image == 'agent' && 'org.opencontainers.image.description=Agent part of Tugtainer app, providing secure remote access to Docker hosts' || '' }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.get-tags.outputs.prefixed }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: 'type=image,"name=docker.io/${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }},ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }}",push-by-digest=true,name-canonical=true,push=true'
          cache-from: type=gha,scope=prod-image-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=prod-image-${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and push multi-platform prod images
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download app digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests-app
          pattern: digests-app-*
          merge-multiple: true

      - name: Download agent digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests-agent
          pattern: digests-agent-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Tags
        id: get-tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.event.client_payload.version }}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid version '$VERSION'. Expected numeric format like 1.31.4"
            exit 1
          fi

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          PREFIXED=v$VERSION

          echo "full=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "prefixed=$PREFIXED" >> $GITHUB_OUTPUT

      - name: Docker Metadata App
        id: app-meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.get-tags.outputs.full }}
            type=raw,value=${{ steps.get-tags.outputs.major }}
            type=raw,value=${{ steps.get-tags.outputs.prefixed }}
            type=raw,value=latest

      - name: Docker Metadata Agent
        id: agent-meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.AGENT_IMAGE_NAME }}
            ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ env.AGENT_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.get-tags.outputs.full }}
            type=raw,value=${{ steps.get-tags.outputs.major }}
            type=raw,value=${{ steps.get-tags.outputs.prefixed }}
            type=raw,value=latest

      - name: Create app manifest list and push
        working-directory: ${{ runner.temp }}/digests-app
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.app-meta.outputs.json }}
          DOCKER_REPO: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          GHCR_REPO: ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
        run: |
          for image in "$DOCKER_REPO" "$GHCR_REPO"; do
            docker buildx imagetools create \
              $(jq -cr --arg img "$image:" '.tags | map(select(startswith($img)) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
              $(printf "$image@sha256:%s " *)
          done

      - name: Create agent manifest list and push
        working-directory: ${{ runner.temp }}/digests-agent
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.agent-meta.outputs.json }}
          DOCKER_REPO: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.AGENT_IMAGE_NAME }}
          GHCR_REPO: ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ env.AGENT_IMAGE_NAME }}
        run: |
          for image in "$DOCKER_REPO" "$GHCR_REPO"; do
            docker buildx imagetools create \
              $(jq -cr --arg img "$image:" '.tags | map(select(startswith($img)) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
              $(printf "$image@sha256:%s " *)
          done

      - name: Inspect images
        env:
          DOCKER_REPO: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          GHCR_REPO: ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          AGENT_DOCKER_REPO: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.AGENT_IMAGE_NAME }}
          AGENT_GHCR_REPO: ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ env.AGENT_IMAGE_NAME }}
        run: |
          docker buildx imagetools inspect "$DOCKER_REPO:${{ steps.get-tags.outputs.full }}"
          docker buildx imagetools inspect "$GHCR_REPO:${{ steps.get-tags.outputs.full }}"
          docker buildx imagetools inspect "$AGENT_DOCKER_REPO:${{ steps.get-tags.outputs.full }}"
          docker buildx imagetools inspect "$AGENT_GHCR_REPO:${{ steps.get-tags.outputs.full }}"
