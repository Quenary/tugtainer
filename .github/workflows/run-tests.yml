name: Run Tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Run tests
        if: always() && steps.install.outcome == 'success'
        run: npm run test:ci

      - name: Run lint
        if: always() && steps.install.outcome == 'success'
        run: npm run lint

      - name: Run Prettier check
        if: always() && steps.install.outcome == 'success'
        run: npm run prettier-check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          activate-environment: true

      - name: Cache venv + uv cache
        uses: actions/cache@v6
        with:
          path: |
            .venv
            ~/.cache/uv
          key: venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-
            venv-${{ runner.os }}-${{ runner.arch }}-
            venv-${{ runner.os }}-

      - name: Install dependencies
        id: install
        run: uv sync --locked

      - name: Run pytest
        if: always() && steps.install.outcome == 'success'
        run: python -m pytest

      - name: Run Ruff
        if: always() && steps.install.outcome == 'success'
        run: ruff check agent backend shared

      - name: Run Mypy
        if: always() && steps.install.outcome == 'success'
        run: mypy agent backend shared

  # The host leg uses the runner's Docker engine. The Docker 24 leg starts
  # a nested daemon from run-suite.sh. ubuntu-latest already exposes
  # /var/run/docker.sock; avoid ubuntu-slim, which cannot use it.
  app-tests:
    name: Application tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current Docker
            engine: host
            swarm: "1"
          - name: Docker 24
            engine: "24"
            swarm: "0"
    defaults:
      run:
        working-directory: ./tests
    env:
      # setup-node caches this directory. The Playwright container mounts it.
      # On Docker 24 it has to live inside the repo: the nested daemon only
      # sees that mount.
      npm_config_cache: ${{ github.workspace }}/.npm
      TUGTAINER_NPM_CACHE: ${{ github.workspace }}/.npm
      TUGTAINER_ENGINE: ${{ matrix.engine }}
      TUGTAINER_SWARM: ${{ matrix.swarm }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      # docker driver, not docker-container: a BuildKit container on the
      # engine makes the swarm schedule spec skip. Compose build uses this
      # Buildx and the cache declared on the app service.
      - name: Set up Docker Buildx
        if: steps.install.outcome == 'success'
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Run application tests
        if: steps.install.outcome == 'success'
        run: bash ./scripts/run-suite.sh

      - name: Run lint
        if: always() && steps.install.outcome == 'success' && matrix.engine == 'host'
        run: npm run lint

      - name: Run Prettier check
        if: always() && steps.install.outcome == 'success' && matrix.engine == 'host'
        run: npm run prettier-check

      # The Playwright container writes the npm cache as root. setup-node
      # saves that directory after this step and cannot read root-owned files.
      - name: Restore npm cache ownership
        if: always() && steps.install.outcome == 'success'
        run: |
          if [ -d "$npm_config_cache" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$npm_config_cache"
          fi
