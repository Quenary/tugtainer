  HEALTH: 상태 확인
  CHECK_ENABLED: 자동 확인
  CHECK_HINT: |-
    자동으로 확인합니다.
    이 설정은 예약된 작업에만 영향을 줍니다.
  UPDATE_ENABLED: 자동 업데이트
  UPDATE_HINT: |-
    자동으로 업데이트합니다.
    이 설정은 예약된 작업에만 영향을 줍니다.
  CHECKED_AT: 마지막 확인
  UPDATED_AT: 마지막 업데이트
  REMOTE_DIGESTS_CHANGED_AT: 원격 다이제스트 변경 시각
  DELAY_UPDATE_FOR: 업데이트 전 지연(초)
  DELAY_UPDATE_FOR_HINT: |-
    이 컨테이너에 대한 전역 지연 재정의(초). 비우면 전역 설정을 사용합니다.
    예: 86400 = 1일. 수동 업데이트는 지연을 무시합니다.
  PREVIOUS_IMAGE: 이전 이미지
  PREVIOUS_IMAGE_HINT: |-
    컨테이너가 마지막 업데이트 전에 사용하던 이미지입니다.
    해당 버전으로 되돌리려면 compose 파일에 고정하세요.
  PREVIOUS_IMAGE_VERSION: 이전 이미지 버전
  PREVIOUS_IMAGE_VERSION_HINT: |-
    이전 이미지의 레이블에 기록된 버전입니다.
    이미지 게시자가 제공하는 참고 값이며 항상 받을 수 있는
    태그는 아닙니다. 대신 이전 이미지를 고정하세요.
  UPDATE: 업데이트
  UPDATE_DISABLED_HINTS:
    PROTECTED: 보호된 컨테이너는 앱에서 업데이트할 수 없습니다.
    NOT_RUNNING: 컨테이너는 실행 중 상태여야 합니다.
  CHECK: 확인
  MAIN_BTN_HINT: |-
    업데이트되는 컨테이너의 종속 컨테이너도 함께 중지되고 시작됩니다.
    여러 행을 선택해 한꺼번에 확인하거나 업데이트할 수 있습니다.
  PROTECTED: 보호됨
  PROTECTED_CONTAINER_HINT:
    이 컨테이너는 dev.quenary.tugtainer.protected로 표시되어 있어
    앱에서 업데이트할 수 없습니다.
  GENERAL:
    LABEL: 일반
  LOGS:
    LABEL: 로그
    SINCE: 시작 시각
    UNTIL: 종료 시각
    TAIL: 표시할 줄 수
