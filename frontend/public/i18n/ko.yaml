    STOP: 중지
    RESTART: 재시작
    KILL: 강제 종료
    PAUSE: 일시 정지
    UNPAUSE: 일시 정지 해제
  HOOKS:
    LABEL: 훅
    PRE_UPDATE: Pre-update
    POST_UPDATE: Post-update
    PRE_STOP: Pre-stop
    PRE_ROLLBACK: Pre-rollback
    POST_ROLLBACK: Post-rollback
    SAVE: 저장
    PLACEHOLDER: 한 줄에 shell 명령 하나씩
IMAGES:
  SEARCH_PLACEHOLDER: ID, 저장소, 태그
  REPOSITORY: 저장소
  ID: ID
  DANGLING: 댕글링
  UNUSED: 미사용
  TAGS: 태그
  SIZE: 크기
  SIZE_UNIT: MB
  CREATED: 생성일
SETTINGS:
  VALUE: 값
  SECTIONS:
    CHANGE_PASSWORD: 비밀번호 변경
    APP_SETTINGS: 앱 설정
  BY_KEY:
    CHECK_CRONTAB_EXPR:
      LABEL: 확인 주기 Crontab 표현식
      HINT: |-
        예약된 작업을 위한 Crontab 표현식입니다. 예:
        매시간 실행하려면 '0 * * * *'.

        자세한 내용은 클릭하여 확인하세요.
      LINK: https://crontab.guru/
    UPDATE_CRONTAB_EXPR:
      LABEL: 업데이트 주기 Crontab 표현식
      HINT: |-
        예약된 작업을 위한 Crontab 표현식입니다. 예:
        매시간 실행하려면 '0 * * * *'.

        자세한 내용은 클릭하여 확인하세요.
      LINK: https://crontab.guru/
    NOTIFICATION_URLS:
      LABEL: 알림 URL
      HINT: |-
        Apprise를 통한 알림용 URL입니다. 예: tgram://<token>/<chat_id>
        여러 개를 지정하려면 한 줄에 하나씩 입력하세요.

        자세한 내용은 클릭하여 확인하세요.
      LINK: https://github.com/caronc/apprise?tab=readme-ov-file#productivity-based-notifications
    TIMEZONE:
      LABEL: 시간대
      HINT: 'IANA 형식의 시간대입니다. 예: Asia/Seoul'
    REGISTRY_REQ_DELAY:
      LABEL: 레지스트리 요청 지연 시간(초)
      HINT: 요청 제한(rate limit)을 피하기 위한 매니페스트, 풀 등 레지스트리 요청 간의 지연 시간입니다.
    PULL_BEFORE_CHECK:
      LABEL: 확인 전 풀(pull) 실행
      HINT: 풀할 때만 매니페스트를 갱신하는 레지스트리 프록시를 사용하는 경우 유용합니다.
    UPDATE_ONLY_RUNNING:
      LABEL: 실행 중인 컨테이너만 업데이트
      HINT: 실행 중이 아닌 컨테이너를 업데이트할 경우 일부 설정이 유실될 수 있으니 주의하세요.
    DELAY_UPDATE_FOR:
      LABEL: 업데이트 전 지연(초)
      HINT: |-
        새 이미지가 감지된 후 예약 업데이트를 적용하기까지 기다릴 시간입니다.
        보안 버퍼로 유용합니다: 잘못된 이미지이나 변조된 이미지가 게시되면
        대기하는 동안 게시자가 회수하거나 수정본을 올릴 시간을 벌 수 있습니다.

        0 = 다음 예약 실행 시 업데이트(기본값, 기존 동작).
        예: 86400 = 1일, 172800 = 2일.

        수동 업데이트는 지연을 무시합니다.
    NOTIFICATION_TITLE_TEMPLATE:
      LABEL: 알림 제목 템플릿
      HINT: |-
        알림 제목의 Jinja2 템플릿입니다.

        자세한 내용은 클릭하여 확인하세요.
      LINK: https://github.com/Quenary/tugtainer/blob/main/docs/NOTIFICATIONS.md
    NOTIFICATION_BODY_TEMPLATE:
      LABEL: 알림 본문 템플릿
      HINT: |-
        알림 본문의 Jinja2 템플릿입니다.

        자세한 내용은 클릭하여 확인하세요.
      LINK: https://github.com/Quenary/tugtainer/blob/main/docs/NOTIFICATIONS.md
    INSECURE_REGISTRIES:
      LABEL: 안전하지 않은 레지스트리
      HINT: |-
        한 줄에 하나씩 입력하세요. 예:

        my.registry.local
        10.0.0.25:5000

        이 설정은 HEAD 요청(업데이트 확인)에만 영향을 줍니다.
        풀(pull)의 경우 호스트 머신의 /etc/docker/daemon.json을 직접 수정해야 합니다.
        사용자 지정 레지스트리를 사용할 때 유용할 수 있습니다.
    SEND_TEST_NOTIFICATION: 테스트 알림 보내기
