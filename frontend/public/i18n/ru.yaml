      PRUNE_ALL: Очистить все
      PRUNE_ALL_HINT: Этот переключатель соответствует флагу --all команды 'docker image prune'.
      URL: Адрес агента
      URL_PLACEHOLDER: http://127.0.0.1:8001
      SECRET: Секрет агента
      CHANGE_SECRET: Изменить секрет
      HAS_SECRET: Секрет задан
      SSL: SSL
      SSL_HINT: Использовать проверку SSL для запросов backend → agent.
      SSL_CA: Свой CA
      SSL_CA_HINT:
        PEM CA (или self-signed сертификат) для проверки TLS запросов
        backend → agent. Используется только при включённом SSL. Пустое поле —
        системные CA.
      SSL_CA_PLACEHOLDER: '-----BEGIN CERTIFICATE-----'
      TIMEOUT: Таймаут агента
      TIMEOUT_HINT: Таймаут в секундах для обычно быстрых запросов к агенту.
        Не влияет на потенциально долгие запросы, например создание контейнера
        или pull образа.
      CONTAINER_HC_TIMEOUT: Таймаут healthcheck контейнера
      CONTAINER_HC_TIMEOUT_HINT:
        Таймаут в секундах ожидания healthcheck во время обновления
        перед началом отката.
