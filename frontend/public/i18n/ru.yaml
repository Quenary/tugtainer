  CARD:
    DELETE_CONFIRM: Удалить этот хост?
    HELP:
      LABEL: Справка
      TEXT: |-
        Если вы не смонтировали docker socket напрямую в контейнер, требуется
        переменная окружения DOCKER_HOST — её можно задать в docker-compose или
        команде docker.
        Секрет агента (и переменная AGENT_SECRET) обязателен, если только вы
        не установили ALLOW_UNAUTHENTICATED_AGENT=true в целях разработки.
        Для основного экземпляра Tugtainer адрес агента — http://127.0.0.1:8001.
        Для удалённых хостов нужно развернуть Tugtainer Agent
        (ghcr.io/quenary/tugtainer-agent) и указать его адрес и секрет
        в соответствующих полях.
      HELP_BTN: Руководство по развёртыванию
