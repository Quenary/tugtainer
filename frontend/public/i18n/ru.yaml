    Настройка влияет только на плановую задачу.
  UPDATE_ENABLED: Автообновление
  UPDATE_HINT: |-
    Обновлять автоматически.
    Настройка влияет только на плановую задачу.
  CHECKED_AT: Последняя проверка
  UPDATED_AT: Последнее обновление
  REMOTE_DIGESTS_CHANGED_AT: Последнее изменение remote digests
  DELAY_UPDATE_FOR: Задержка перед обновлением, в секундах
  DELAY_UPDATE_FOR_HINT: |-
    Переопределение глобальной задержки для этого контейнера (секунды).
    Пусто = использовать глобальную настройку. Пример: 86400 = 1 день.
    Ручное обновление игнорирует задержку.
  PREVIOUS_IMAGE: Предыдущий образ
  PREVIOUS_IMAGE_HINT: |-
    Образ, на котором контейнер работал до последнего обновления.
    Укажите его в compose файле, чтобы вернуться к этой версии.
  PREVIOUS_IMAGE_VERSION: Версия предыдущего образа
  PREVIOUS_IMAGE_VERSION_HINT: |-
    Версия из лейблов предыдущего образа.
    Это подсказка от издателя образа, и она не всегда является
    тегом, который можно скачать. Используйте предыдущий образ.
  UPDATE: Обновить
  UPDATE_DISABLED_HINTS:
    PROTECTED: Защищённый контейнер нельзя обновить из приложения.
    NOT_RUNNING: Контейнер должен быть в состоянии running.
  CHECK: Проверить
  MAIN_BTN_HINT: |-
    Зависимые контейнеры останавливаются и запускаются вместе с обновляемыми.
    Выберите несколько строк, чтобы проверить или обновить их вместе.
  PROTECTED: Защищён
  PROTECTED_CONTAINER_HINT:
    Контейнер помечен меткой dev.quenary.tugtainer.protected
    и не может быть обновлён из приложения.
