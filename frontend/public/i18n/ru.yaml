SETTINGS:
  VALUE: Значение
  SECTIONS:
    CHANGE_PASSWORD: Сменить пароль
    APP_SETTINGS: Настройки приложения
  BY_KEY:
    CHECK_CRONTAB_EXPR:
      LABEL: Crontab-выражение проверки
      HINT: |-
        Crontab-выражение для периодической задачи, например
        0 * * * * — каждый час.

        Нажмите для подробностей.
      LINK: https://crontab.guru/
    UPDATE_CRONTAB_EXPR:
      LABEL: Crontab-выражение обновления
      HINT: |-
        Crontab-выражение для периодической задачи, например
        0 * * * * — каждый час.

        Нажмите для подробностей.
      LINK: https://crontab.guru/
    NOTIFICATION_URLS:
      LABEL: URL уведомлений
      HINT: |-
        URL для уведомлений через Apprise, например tgram://<token>/<chat_id>
        Можно указать несколько, каждый с новой строки.

        Нажмите для подробностей.
      LINK: https://github.com/caronc/apprise?tab=readme-ov-file#productivity-based-notifications
    TIMEZONE:
      LABEL: Часовой пояс
      HINT: Часовой пояс в формате IANA, например Europe/Moscow
    REGISTRY_REQ_DELAY:
      LABEL: Задержка запросов к registry, сек
      HINT: Задержка между запросами к registry (manifest, pull и т.д.), чтобы избежать rate limit.
    PULL_BEFORE_CHECK:
      LABEL: Pull перед проверкой
      HINT: Полезно, если вы используете registry-прокси, который обновляет манифесты только при pull.
    UPDATE_ONLY_RUNNING:
      LABEL: Обновлять только запущенные контейнеры
      HINT: 'Будьте осторожны: при обновлении незапущенных контейнеров часть конфигурации может быть потеряна.'
    DELAY_UPDATE_FOR:
      LABEL: Задержка перед обновлением, в секундах
      HINT: |-
        Сколько ждать после обнаружения нового образа перед плановым
        обновлением. Полезно как буфер безопасности: если опубликован
        плохой или скомпрометированный образ, задержка даёт время
        отозвать его или выпустить исправление до того, как вы его
        скачаете.

        0 = обновлять при следующем плановом запуске (поведение по
        умолчанию). Пример: 86400 = 1 день, 172800 = 2 дня.

        Ручное обновление игнорирует задержку.
    NOTIFICATION_TITLE_TEMPLATE:
      LABEL: Шаблон заголовка уведомления
      HINT: |-
        Jinja2-шаблон заголовка уведомления.

        Нажмите для подробностей.
      LINK: https://github.com/Quenary/tugtainer/blob/main/docs/NOTIFICATIONS.md
    NOTIFICATION_BODY_TEMPLATE:
      LABEL: Шаблон текста уведомления
      HINT: |-
        Jinja2-шаблон текста уведомления.

        Нажмите для подробностей.
      LINK: https://github.com/Quenary/tugtainer/blob/main/docs/NOTIFICATIONS.md
    INSECURE_REGISTRIES:
      LABEL: Небезопасные registries
      HINT: |-
        По одному registry на строку, например

        my.registry.local
        10.0.0.25:5000

        Настройка влияет только на HEAD-запрос (проверка обновлений).
        Для pull нужно изменить /etc/docker/daemon.json на хосте.
        Полезно при использовании кастомного registry.
    SEND_TEST_NOTIFICATION: Отправить тестовое уведомление
