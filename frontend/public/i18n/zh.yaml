      LABEL: 帮助
      TEXT: |-
        若未将 Docker Socket 直接挂载至容器，则必须配置 DOCKER_HOST
        环境变量（可通过 docker-compose 或 docker 命令设置）。
        Agent 密钥（以及 AGENT_SECRET 环境变量）为必填项，除非您出于开发目的
        设置了 ALLOW_UNAUTHENTICATED_AGENT=true。
        Tugtainer 主实例的 Agent 地址为 http://127.0.0.1:8001。
        管理远程主机时，需部署 Tugtainer Agent (ghcr.io/quenary/tugtainer-agent)，
        并在对应字段填入其地址和密钥。
