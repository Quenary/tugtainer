SETTINGS:
  VALUE: 值
  SECTIONS:
    CHANGE_PASSWORD: 修改密码
    APP_SETTINGS: 应用设置
  BY_KEY:
    CHECK_CRONTAB_EXPR:
      LABEL: 检查 Crontab 表达式
      HINT: |-
        用于定期任务的 Crontab 表达式，例如
        0 * * * * 表示每小时一次。

        点击了解更多信息。
      LINK: https://crontab.guru/
    UPDATE_CRONTAB_EXPR:
      LABEL: 更新 Crontab 表达式
      HINT: |-
        用于定期任务的 Crontab 表达式，例如
        0 * * * * 表示每小时一次。

        点击了解更多信息。
      LINK: https://crontab.guru/
    NOTIFICATION_URLS:
      LABEL: 通知 URLs
      HINT: |-
        用于通过 Apprise 发送通知的 URLs，例如 tgram://<token>/<chat_id>
        您可以指定多个，每个一行。

        点击了解更多信息。
      LINK: https://github.com/caronc/apprise?tab=readme-ov-file#productivity-based-notifications
    TIMEZONE:
      LABEL: 时区
      HINT: IANA 格式的时区，例如 Asia/Shanghai
    REGISTRY_REQ_DELAY:
      LABEL: Registry 请求延迟（秒）
      HINT: Registry 请求（如 manifest、pull 等）之间的延迟，以避免触发速率限制。
    PULL_BEFORE_CHECK:
      LABEL: 检查前先拉取
      HINT: 如果您使用的 registry 代理仅在拉取时更新 manifest，此选项可能有用。
    UPDATE_ONLY_RUNNING:
      LABEL: 仅更新运行中的容器
      HINT: 请谨慎：更新未运行的容器时，部分配置可能会丢失。
    DELAY_UPDATE_FOR:
      LABEL: 更新前延迟（秒）
      HINT: |-
        检测到新镜像后，等待多久再执行计划更新。可用作安全缓冲：若发布了
        有问题或被篡改的镜像，延迟可让发布者有时间撤回或修复，避免你拉取到它。

        0 = 在下一次计划任务时更新（默认，与原先行为一致）。
        示例：86400 = 1 天，172800 = 2 天。

        手动更新会忽略延迟。
    NOTIFICATION_TITLE_TEMPLATE:
      LABEL: 通知标题模板
      HINT: |-
        通知标题的 Jinja2 模板。

        点击了解更多信息。
      LINK: https://github.com/Quenary/tugtainer/blob/main/docs/NOTIFICATIONS.md
    NOTIFICATION_BODY_TEMPLATE:
      LABEL: 通知正文模板
      HINT: |-
        通知正文的 Jinja2 模板。

        点击了解更多信息。
      LINK: https://github.com/Quenary/tugtainer/blob/main/docs/NOTIFICATIONS.md
    INSECURE_REGISTRIES:
      LABEL: 不安全的 registries
      HINT: |-
        每行一个 registry，例如

        my.registry.local
        10.0.0.25:5000

        此设置仅影响 HEAD 请求（检查更新）。
        拉取镜像需在宿主机修改 /etc/docker/daemon.json。
        如果您使用自定义 registry，此选项可能有用。
    SEND_TEST_NOTIFICATION: 发送测试通知
