<form
  class="form"
  [formGroup]="form"
  (submit)="onSubmit()">
  <p class="setup-hint">
    {{ 'AUTH.SETUP_HINT' | translate }}
  </p>

  <p-iftaLabel class="form-field">
    <input
      pInputText
      id="setup-code"
      class="setup-code"
      [pAutoFocus]="true"
      autocomplete="one-time-code"
      formControlName="setup_code"
      [fluid]="true" />
    <label for="setup-code">
      {{ 'AUTH.SETUP_CODE' | translate }}
    </label>
  </p-iftaLabel>

  <!-- Chrome hack -->
  <input
    type="text"
    id="login_username"
    name="login_username"
    autocomplete="username"
    style="display: none" />

  <app-password-field
    [control]="form.controls.password"
    inputId="new-password"
    labelKey="AUTH.PASSWORD"
    autocomplete="new-password">
  </app-password-field>

  <app-password-field
    [control]="form.controls.confirm_password"
    inputId="confirm-new-password"
    labelKey="AUTH.CONFIRM_PASSWORD"
    autocomplete="new-password"
    [invalid]="confirmPasswordError()">
  </app-password-field>

  <p-button
    [fluid]="true"
    class="form-button"
    type="submit"
    [loading]="isLoading()"
    [disabled]="!form.dirty">
    <i class="pi pi-save"></i>
    <span pButtonLabel>
      {{ 'GENERAL.SAVE' | translate }}
    </span>
  </p-button>
</form>
