@if (job(); as j) {
  <section class="results">
    @for (item of items(); track item.id) {
      <div class="results-item">
        <span>{{ item.name }}</span>
        @if (item.result) {
          <p-tag
            [severity]="item.severity"
            [attr.title]="item.error ?? null">
            {{ item.result }}
          </p-tag>
        }
        @if (item.error) {
          <span class="result-error">{{ item.error }}</span>
        }
      </div>
    }
  </section>

  @if (j.prune_result) {
    <pre>
      {{ j.prune_result }}
    </pre>
  }
}
