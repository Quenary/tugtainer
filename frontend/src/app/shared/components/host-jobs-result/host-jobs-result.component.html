@if (job(); as j) {
  <h3>
    {{ j.host_name }}
  </h3>

  <section class="results">
    @for (slot of containerSlots(); track slot.result.container.Id) {
      <div class="results-item">
        <span>{{ slot.result.container.Name }}</span>
        <p-tag
          [severity]="ContainerJobOutcomeSeverity[slot.result.result] ?? 'contrast'">
          {{ slot.result.result }}
        </p-tag>
      </div>
    }
  </section>

  @if (j.prune_result) {
    <pre>
      {{ j.prune_result }}
    </pre>
  }
}
