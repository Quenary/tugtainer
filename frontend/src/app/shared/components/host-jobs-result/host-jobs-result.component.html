@if (job(); as j) {
  <section class="results">
    @for (item of items(); track item.id) {
      <div class="results-item">
        <span>{{ item.name }}</span>
        @if (item.result) {
          <p-tag [severity]="item.severity">
            {{ item.result }}
          </p-tag>
        }
      </div>
    }
  </section>

  @if (j.prune_result) {
    <pre>
      {{ j.prune_result }}
    </pre>
  }
}
