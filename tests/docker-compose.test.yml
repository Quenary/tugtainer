services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-jammy
    working_dir: /tests
    volumes:
      - .:/tests
    environment:
      # FQDN alias — Chromium refuses single-label hosts like "app"
      BASE_URL: http://app.tugtainer.test
      CI: 'true'
    ipc: host
    networks:
      - tugtainer-tests
    command: sh -c "npm ci && npx playwright test"

networks:
  tugtainer-tests:
    external: true
    name: tugtainer-tests
